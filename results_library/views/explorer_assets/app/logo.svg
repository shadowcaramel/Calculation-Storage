<g class="ink"><rect x="8" y="74" width="18" height="18"/><rect x="8" y="52" width="18" height="18"/><rect x="30" y="52" width="18" height="18"/><rect x="52" y="52" width="18" height="18"/><rect x="30" y="30" width="18" height="18"/><rect x="74" y="30" width="18" height="18"/><rect x="52" y="8" width="18" height="18"/></g>
<rect x="30" y="74" width="18" height="18" fill="#1f4fa0"/><rect x="52" y="30" width="18" height="18" fill="#d52b1e"/><rect x="74" y="8" width="18" height="18" fill="#f2b807"/>
</svg>
