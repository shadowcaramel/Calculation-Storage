<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Calculation results{% endblock %}</title>
<link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body>
<header>
  <nav class="crumbs">
    <a href="{{ root }}index.html">All results</a>
    {%- block crumbs %}{% endblock %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <p>Generated {{ generated_at }} from {{ record_count }} stored result{{ '' if record_count == 1 else 's' }}.
     Rebuild with <code>python -m results_library.cli build</code>.</p>
</footer>
<script src="{{ root }}assets/app.js"></script>
</body>
</html>
